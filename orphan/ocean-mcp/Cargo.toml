[package]
name = "ocean-mcp"
edition = "2024"

[[bin]]
name = "ocean_mcp"
path = "src/main.rs"

[dependencies]
ocean-cli = { path = "../ocean-cli" }
ocean-fs = { path = "../ocean-fs" }
ocean-storage = { path = "../ocean-storage" }
rmcp = { version = "2", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
